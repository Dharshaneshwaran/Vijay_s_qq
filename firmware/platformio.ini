[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    olikraus/U8g2@^2.35.9

; ============================================================
; ESP32-CAM (AI-Thinker) port
; OLED is wired to the free GPIOs, NOT the camera pins:
;   OLED SDA <-> GPIO14   (ESP32-CAM pin label: I/O 14)
;   OLED SCL <-> GPIO15   (ESP32-CAM pin label: I/O 15)
; Upload requires an external USB-UART (UART0 TX=GPIO1 / RX=GPIO3).
; ============================================================
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 9600
lib_deps =
    olikraus/U8g2@^2.35.9
