; ============================================================
; ESP32-CAM (AI-Thinker) standalone project
; OLED wiring:
;   OLED SDA <-> GPIO14   (ESP32-CAM pin label: I/O 14)
;   OLED SCL <-> GPIO15   (ESP32-CAM pin label: I/O 15)
;   OLED VCC <-> 3.3V     OLED GND <-> GND  (I2C addr 0x3C)
; Upload: use an external USB-UART on UART0 (TX=GPIO1, RX=GPIO3)
; with GPIO0 pulled LOW for flashing, or an ESP32-CAM-MB base.
; ============================================================
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 9600
lib_deps =
    olikraus/U8g2@^2.35.9