; ============================================================
; QBIT Hub firmware - ESP32-CAM (AI-Thinker)
; OLED wiring:
;   OLED SDA <-> GPIO14   (ESP32-CAM pin label: I/O 14)
;   OLED SCL <-> GPIO15   (ESP32-CAM pin label: I/O 15)
;   OLED VCC <-> 3.3V     OLED GND <-> GND  (I2C addr 0x3C)
; Upload: use an external USB-UART on UART0 (TX=GPIO1, RX=GPIO3)
; with GPIO0 pulled LOW for flashing, or an ESP32-CAM-MB base.
;
; Connects to the desktop app over classic Bluetooth SPP
; (BluetoothSerial, device name "QBIT-Hub"). BluetoothSerial is
; part of the Arduino-ESP32 core, so no extra lib is required.
; Classic BT needs a partition table with enough app space -
; "huge_app" gives 3 MB app / no OTA, which fits BT + U8g2.
; ============================================================
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 9600
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    olikraus/U8g2@^2.35.9
